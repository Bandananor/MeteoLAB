# A/B experiments (src/core/experiments.test.ts): every variant x scenario in its own job, in parallel. Started by hand
# (Actions -> Experiments -> Run workflow) or by a push to an exp/** branch with the default lists. Results: the run's
# summary page and one annotation per job with the time series.
name: Experiments

on:
  workflow_dispatch:
    inputs:
      variants:
        description: 'JSON list: base, uniform, warm, fixed, old, aniso'
        default: '["base", "aniso"]'
      scenarios:
        description: 'JSON list of SCENARIOS indices'
        default: '[0, 2, 5, 7]'
  push:
    branches: ['exp/**']

jobs:
  experiment:
    name: ${{ matrix.variant }} / scenario ${{ matrix.scenario }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(inputs.variants || '["base", "aniso"]') }}
        scenario: ${{ fromJSON(inputs.scenarios || '[0, 2, 5, 7]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - name: Run
        env: { STORMLAB_EXPERIMENT: '${{ matrix.variant }}', STORMLAB_SCENARIO: '${{ matrix.scenario }}' }
        run: |
          set -o pipefail
          npx vitest run --mode slow src/core/experiments.test.ts 2>&1 | tee test.log
      - name: Report
        if: always()
        run: |
          # The test writes its result to experiment.txt (vitest does not show the output of passing tests).
          [ -s experiment.txt ] && cp experiment.txt result.txt || { grep -E 'Tests |Error' test.log | head -3 > result.txt; }
          { echo '```'; cat result.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=${{ matrix.variant }} / scenario ${{ matrix.scenario }}::$(sed ':a;N;$!ba;s/\n/%0A/g' result.txt)"

  calibration:
    name: Weisman-Klemp split with anisotropic turbulence
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - name: Run
        env: { STORMLAB_TURBULENCE: anisotropic }
        run: |
          set -o pipefail
          npm run test:slow 2>&1 | tee test.log
      - name: Report
        if: always()
        run: |
          line=$(grep -E '^\s+Tests ' test.log | tail -1 | sed 's/^ *//')
          fail=$(grep -E 'AssertionError' test.log | head -1 | sed 's/^ *//')
          echo "### WK anisotropic: ${line:-no result} ${fail}" >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=WK anisotropic::EXPERIMENT WK split / aniso: ${line:-no result} ${fail}"
