# Fast tests, the Weisman-Klemp calibration, the diurnal cycle and every scenario (9), each in its own job (in parallel):
# about 20-30 min instead of ~3 h on one laptop core. Results: the run's summary page and one annotation per job.
name: Tests

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/core/**', 'package*.json', 'vitest.config.ts', '.github/workflows/slow-tests.yml']

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: Fast tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run build
      - name: npm test
        run: |
          set -o pipefail
          npm test 2>&1 | tee test.log
      - name: Report
        if: always()
        run: |
          # vitest colours its output in CI: strip the ANSI codes so the summary lines can be found.
          sed -i 's/\x1b\[[0-9;]*m//g' test.log
          line=$(grep -E '^\s+Tests ' test.log | tail -1 | sed 's/^ *//')
          echo "### Fast tests: ${line:-no result}" >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Fast tests::${line:-no result}"

  calibration:
    name: Weisman-Klemp (60 min)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - name: npm run test:slow
        run: |
          set -o pipefail
          npm run test:slow 2>&1 | tee test.log
      - name: Report
        if: always()
        run: |
          sed -i 's/\x1b\[[0-9;]*m//g' test.log
          line=$(grep -E '^\s+Tests ' test.log | tail -1 | sed 's/^ *//')
          fail=$(grep -E 'AssertionError|Error:' test.log | head -1 | sed 's/^ *//')
          echo "### Weisman-Klemp: ${line:-no result} ${fail}" >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Weisman-Klemp::${line:-no result} ${fail}"

  reference:
    name: Reference cases (Straka, Bryan-Fritsch)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - name: npm run test:reference
        env: { STORMLAB_RESULT: reference.txt }
        run: |
          set -o pipefail
          npm run test:reference 2>&1 | tee test.log
      - name: Report
        if: always()
        run: |
          sed -i 's/\x1b\[[0-9;]*m//g' test.log
          line=$(grep -E '^\s+Tests ' test.log | tail -1 | sed 's/^ *//')
          fail=$(grep -E 'AssertionError|Error:' test.log | head -1 | sed 's/^ *//')
          result=$(cat reference.txt 2>/dev/null | paste -sd ';' -)
          echo "### Reference: ${line:-no result} ${fail} ${result}" >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Reference::${line:-no result} ${fail} ${result}"

  diurnal:
    name: Diurnal cycle (06:00 to the first storm)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - name: npm run test:diurnal
        run: |
          set -o pipefail
          npm run test:diurnal 2>&1 | tee test.log
      - name: Report
        if: always()
        run: |
          sed -i 's/\x1b\[[0-9;]*m//g' test.log
          result=$(grep -E 'first thunderstorm' test.log | tail -1 | sed 's/^ *//')
          line=$(grep -E '^\s+Tests ' test.log | tail -1 | sed 's/^ *//')
          fail=$(grep -E 'AssertionError' test.log | head -1 | sed 's/^ *//')
          echo "### ${result:-Diurnal cycle: no result} — ${line} ${fail}" >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Diurnal cycle::${result:-no result} | ${line} ${fail}"

  scenario:
    name: Scenario ${{ matrix.index }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        index: [0, 1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - name: Scenario ${{ matrix.index }}
        env: { STORMLAB_SCENARIO: '${{ matrix.index }}' }
        run: |
          set -o pipefail
          npx vitest run --mode slow src/core/scenarios.test.ts -t 'calibration' 2>&1 | tee test.log
      - name: Report
        if: always()
        run: |
          sed -i 's/\x1b\[[0-9;]*m//g' test.log
          result=$(grep -E 'max w .* clipped' test.log | tail -1 | sed 's/^ *//')
          line=$(grep -E '^\s+Tests ' test.log | tail -1 | sed 's/^ *//')
          fail=$(grep -E 'AssertionError' test.log | head -1 | sed 's/^ *//')
          echo "### ${result:-scenario ${{ matrix.index }}: no result} — ${line} ${fail}" >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Scenario ${{ matrix.index }}::${result:-no result} | ${line} ${fail}"
