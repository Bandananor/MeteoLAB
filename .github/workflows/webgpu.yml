name: WebGPU parity

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/gpu/**'
      - 'src/core/**'
      - 'tests/bench/gpucheck.*'
      - 'tools/gpucheck.mjs'
      - 'vite.config.ts'
      - 'package*.json'
      - '.github/workflows/webgpu.yml'

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - name: Compare WebGPU (SwiftShader) against TypeScript
        run: node tools/gpucheck.mjs google-chrome --no-sandbox
