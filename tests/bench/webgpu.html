<!doctype html>
<html><head><meta charset="utf-8"><title>WebGPU bench</title></head>
<body><pre id="out">running… (npx vite, then open /tests/bench/webgpu.html; Chrome picks the integrated GPU unless started with --force_high_performance_gpu)</pre>
<script type="module">
// WebGPU trial (16.11.2026): the cost of WENO5 flux-form transport of one scalar on GPU vs the same kernel in JS, on the
// grids of 1.2 km, 500 m and 250 m (the standard 48 x 36 km domain, 50 levels), and of moving fields between CPU and GPU.
const out = document.getElementById('out'), log = s => { out.textContent += '\n' + s; console.log(s) }
const GRIDS = [['1.2 km', 40, 32, 50], ['500 m', 96, 72, 50], ['250 m', 192, 144, 50]]
const WGSL = /* wgsl */`
struct P { nx: u32, ny: u32, nz: u32, pad: u32, inv: vec4f }
@group(0) @binding(0) var<uniform> p: P;
@group(0) @binding(1) var<storage, read> q: array<f32>;
@group(0) @binding(2) var<storage, read> u: array<f32>;
@group(0) @binding(3) var<storage, read> v: array<f32>;
@group(0) @binding(4) var<storage, read> w: array<f32>;
@group(0) @binding(5) var<storage, read_write> t: array<f32>;
fn id(x: i32, y: i32, z: i32) -> u32 {
  let nx = i32(p.nx); let ny = i32(p.ny); let nz = i32(p.nz);
  let xx = (x % nx + nx) % nx; let yy = (y % ny + ny) % ny; let zz = clamp(z, 0, nz - 1);
  return u32(xx + nx * (yy + ny * zz));
}
fn weno(a: f32, b: f32, c: f32, d: f32, e: f32) -> f32 {
  let b0 = 13.0 / 12.0 * (a - 2.0 * b + c) * (a - 2.0 * b + c) + 0.25 * (a - 4.0 * b + 3.0 * c) * (a - 4.0 * b + 3.0 * c);
  let b1 = 13.0 / 12.0 * (b - 2.0 * c + d) * (b - 2.0 * c + d) + 0.25 * (b - d) * (b - d);
  let b2 = 13.0 / 12.0 * (c - 2.0 * d + e) * (c - 2.0 * d + e) + 0.25 * (3.0 * c - 4.0 * d + e) * (3.0 * c - 4.0 * d + e);
  let a0 = 0.1 / ((1e-6 + b0) * (1e-6 + b0)); let a1 = 0.6 / ((1e-6 + b1) * (1e-6 + b1)); let a2 = 0.3 / ((1e-6 + b2) * (1e-6 + b2));
  return (a0 * (2.0 * a - 7.0 * b + 11.0 * c) + a1 * (-b + 5.0 * c + 2.0 * d) + a2 * (2.0 * c + 5.0 * d - e)) / (6.0 * (a0 + a1 + a2));
}
// Flux through the face between cell s and s+dir (dir one axis), velocity the faces' mean.
fn flux(x: i32, y: i32, z: i32, dx: i32, dy: i32, dz: i32, vel: f32) -> f32 {
  if (vel >= 0.0) {
    return vel * weno(q[id(x - 2*dx, y - 2*dy, z - 2*dz)], q[id(x - dx, y - dy, z - dz)], q[id(x, y, z)], q[id(x + dx, y + dy, z + dz)], q[id(x + 2*dx, y + 2*dy, z + 2*dz)]);
  }
  return vel * weno(q[id(x + 3*dx, y + 3*dy, z + 3*dz)], q[id(x + 2*dx, y + 2*dy, z + 2*dz)], q[id(x + dx, y + dy, z + dz)], q[id(x, y, z)], q[id(x - dx, y - dy, z - dz)]);
}
@compute @workgroup_size(8, 8, 4)
fn main(@builtin(global_invocation_id) g: vec3u) {
  if (g.x >= p.nx || g.y >= p.ny || g.z >= p.nz) { return; }
  let x = i32(g.x); let y = i32(g.y); let z = i32(g.z); let c = id(x, y, z);
  let ue = 0.5 * (u[c] + u[id(x + 1, y, z)]); let uw = 0.5 * (u[c] + u[id(x - 1, y, z)]);
  let vn = 0.5 * (v[c] + v[id(x, y + 1, z)]); let vs = 0.5 * (v[c] + v[id(x, y - 1, z)]);
  let wt = 0.5 * (w[c] + w[id(x, y, z + 1)]); let wb = 0.5 * (w[c] + w[id(x, y, z - 1)]);
  t[c] = -(flux(x, y, z, 1, 0, 0, ue) - flux(x - 1, y, z, 1, 0, 0, uw)) * p.inv.x
         -(flux(x, y, z, 0, 1, 0, vn) - flux(x, y - 1, z, 0, 1, 0, vs)) * p.inv.y
         -(flux(x, y, z, 0, 0, 1, wt) - flux(x, y, z - 1, 0, 0, 1, wb)) * p.inv.z;
}`

// The same kernel in JS (one thread), for the ratio.
function weno(a, b, c, d, e) {
  const b0 = 13 / 12 * (a - 2 * b + c) ** 2 + .25 * (a - 4 * b + 3 * c) ** 2, b1 = 13 / 12 * (b - 2 * c + d) ** 2 + .25 * (b - d) ** 2, b2 = 13 / 12 * (c - 2 * d + e) ** 2 + .25 * (3 * c - 4 * d + e) ** 2
  const a0 = .1 / (1e-6 + b0) ** 2, a1 = .6 / (1e-6 + b1) ** 2, a2 = .3 / (1e-6 + b2) ** 2
  return (a0 * (2 * a - 7 * b + 11 * c) + a1 * (-b + 5 * c + 2 * d) + a2 * (2 * c + 5 * d - e)) / (6 * (a0 + a1 + a2))
}
function cpuKernel(nx, ny, nz, q, u, v, w, t, inv) {
  const id = (x, y, z) => ((x % nx + nx) % nx) + nx * (((y % ny + ny) % ny) + ny * Math.min(nz - 1, Math.max(0, z)))
  const flux = (x, y, z, dx, dy, dz, vel) => vel >= 0
    ? vel * weno(q[id(x - 2 * dx, y - 2 * dy, z - 2 * dz)], q[id(x - dx, y - dy, z - dz)], q[id(x, y, z)], q[id(x + dx, y + dy, z + dz)], q[id(x + 2 * dx, y + 2 * dy, z + 2 * dz)])
    : vel * weno(q[id(x + 3 * dx, y + 3 * dy, z + 3 * dz)], q[id(x + 2 * dx, y + 2 * dy, z + 2 * dz)], q[id(x + dx, y + dy, z + dz)], q[id(x, y, z)], q[id(x - dx, y - dy, z - dz)])
  for (let z = 0; z < nz; z++) for (let y = 0; y < ny; y++) for (let x = 0; x < nx; x++) {
    const c = id(x, y, z)
    const ue = .5 * (u[c] + u[id(x + 1, y, z)]), uw = .5 * (u[c] + u[id(x - 1, y, z)]), vn = .5 * (v[c] + v[id(x, y + 1, z)]), vs = .5 * (v[c] + v[id(x, y - 1, z)]), wt = .5 * (w[c] + w[id(x, y, z + 1)]), wb = .5 * (w[c] + w[id(x, y, z - 1)])
    t[c] = -(flux(x, y, z, 1, 0, 0, ue) - flux(x - 1, y, z, 1, 0, 0, uw)) * inv[0] - (flux(x, y, z, 0, 1, 0, vn) - flux(x, y - 1, z, 0, 1, 0, vs)) * inv[1] - (flux(x, y, z, 0, 0, 1, wt) - flux(x, y, z - 1, 0, 0, 1, wb)) * inv[2]
  }
}

const result = { adapters: [], rows: [] }
window.__result = result
for (const pref of ['high-performance', 'low-power']) {
  const adapter = await navigator.gpu?.requestAdapter({ powerPreference: pref })
  if (!adapter) { log(`${pref}: no adapter`); continue }
  const info = adapter.info ?? {}
  const name = `${info.vendor ?? '?'} ${info.architecture ?? ''} ${info.description ?? ''}`.trim()
  if (result.adapters.includes(name)) { log(`${pref}: same adapter ${name}`); continue }
  result.adapters.push(name)
  const device = await adapter.requestDevice({ requiredLimits: { maxStorageBufferBindingSize: adapter.limits.maxStorageBufferBindingSize, maxBufferSize: adapter.limits.maxBufferSize } })
  const module = device.createShaderModule({ code: WGSL }), pipeline = device.createComputePipeline({ layout: 'auto', compute: { module, entryPoint: 'main' } })
  for (const [label, nx, ny, nz] of GRIDS) {
    const n = nx * ny * nz, rnd = () => Float32Array.from({ length: n }, () => Math.random() * 2 - 1)
    const q = rnd(), u = rnd().map(x => 10 * x), v = rnd().map(x => 10 * x), w = rnd().map(x => 5 * x)
    const buf = (data, usage) => { const b = device.createBuffer({ size: data.byteLength, usage }); device.queue.writeBuffer(b, 0, data); return b }
    const S = GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST | GPUBufferUsage.COPY_SRC
    const params = new ArrayBuffer(32), pu = new Uint32Array(params, 0, 4), pf = new Float32Array(params, 16, 4); pu.set([nx, ny, nz, 0]); pf.set([1 / 1200, 1 / 1200, 1 / 300, 0])
    const P = buf(new Uint8Array(params), GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST), Q = buf(q, S), U = buf(u, S), V = buf(v, S), W = buf(w, S), T = device.createBuffer({ size: n * 4, usage: S })
    const group = device.createBindGroup({ layout: pipeline.getBindGroupLayout(0), entries: [P, Q, U, V, W, T].map((b, k) => ({ binding: k, resource: { buffer: b } })) })
    const run = async times => { const enc = device.createCommandEncoder(); const pass = enc.beginComputePass(); pass.setPipeline(pipeline); pass.setBindGroup(0, group); for (let k = 0; k < times; k++) pass.dispatchWorkgroups(Math.ceil(nx / 8), Math.ceil(ny / 8), Math.ceil(nz / 4)); pass.end(); device.queue.submit([enc.finish()]); await device.queue.onSubmittedWorkDone() }
    await run(5)
    const reps = 200, t0 = performance.now(); await run(reps); const gpuMs = (performance.now() - t0) / reps
    // Check against JS and time JS.
    const tc = new Float32Array(n), inv = [1 / 1200, 1 / 1200, 1 / 300], c0 = performance.now(), cr = n > 1e6 ? 1 : 3
    for (let k = 0; k < cr; k++) cpuKernel(nx, ny, nz, q, u, v, w, tc, inv)
    const cpuMs = (performance.now() - c0) / cr
    const read = device.createBuffer({ size: n * 4, usage: GPUBufferUsage.MAP_READ | GPUBufferUsage.COPY_DST })
    const enc = device.createCommandEncoder(); enc.copyBufferToBuffer(T, 0, read, 0, n * 4); device.queue.submit([enc.finish()]); await read.mapAsync(GPUMapMode.READ)
    const tg = new Float32Array(read.getMappedRange().slice(0)); read.unmap()
    let err = 0, scale = 0; for (let i = 0; i < n; i++) { err = Math.max(err, Math.abs(tg[i] - tc[i])); scale = Math.max(scale, Math.abs(tc[i])) }
    // Transfers: 11 snapshot fields up and down (the live view's needs), timed round trip.
    const fields = 11, big = new Float32Array(n * fields), B = device.createBuffer({ size: big.byteLength, usage: S }), R = device.createBuffer({ size: big.byteLength, usage: GPUBufferUsage.MAP_READ | GPUBufferUsage.COPY_DST })
    const x0 = performance.now(); device.queue.writeBuffer(B, 0, big); await device.queue.onSubmittedWorkDone(); const upMs = performance.now() - x0
    const x1 = performance.now(); const e2 = device.createCommandEncoder(); e2.copyBufferToBuffer(B, 0, R, 0, big.byteLength); device.queue.submit([e2.finish()]); await R.mapAsync(GPUMapMode.READ); R.getMappedRange(); R.unmap(); const downMs = performance.now() - x1
    const row = { adapter: name, grid: label, n, gpuMs: +gpuMs.toFixed(3), cpuMs: +cpuMs.toFixed(1), speedup: +(cpuMs / gpuMs).toFixed(1), relErr: +(err / scale).toExponential(1), upload11Ms: +upMs.toFixed(2), readback11Ms: +downMs.toFixed(2), mb: +(big.byteLength / 1e6).toFixed(1) }
    result.rows.push(row); log(JSON.stringify(row))
    for (const b of [P, Q, U, V, W, T, read, B, R]) b.destroy()
  }
}
result.done = true
log('done')
</script></body></html>
